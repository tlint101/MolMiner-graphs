[project]
name = "MolMiner-graphs"
version = "0.0.1"
description = "For Creaming Molecular Graph Models"
authors = [{ name = "Tony Eight Lin", email = "tonyelin@tmu.edu.tw" }]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "matplotlib (>=3.10.3)",
    "numpy (>=2.0)",
    "pandas (>=2.1)",
    "rdkit (>=2023.09.5)",
    "seaborn (>=0.12.2)",
    "scikit-learn (>=1.6.1)",
    "torch (>=2.1.0)",
    "torchinfo (>=1.8.0)",
    "torch-geometric (>=2.6.1)",
    "torchviz (>=0.0.3)",
    "tabulate (>=0.9.0)",
    "optuna (>=4.9.0)",
]

[project.optional-dependencies]
mlx = [
    "mlx (>=0.31.1)",
    "mlx-graphs (>=0.0.9)",
]

[tool.uv.build-backend]
module-name = ["mminer_graphs"]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "notebook (>=7.4.4)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "ipywidgets (>=8.1.7)",
    "datamol (>=0.12.4)",
    "py50 (>=1.1.0)",
    "shap (>=0.48.0)"
,
]
