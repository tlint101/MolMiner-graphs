[project]
name = "molminer-graphs"
version = "0.0.1"
description = "Create Molecular Graph Models"
authors = [
    { name = "Tony Eight Lin", email = "tonyelin@tmu.edu.tw" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "matplotlib (>=3.10.3)",
    "numpy (>=2.0)",
    "pandas (>=2.1)",
    "rdkit (>=2023.09.5)",
    "seaborn (>=0.12.2)",
    "datamol (>=0.12.4)",
    "notebook (>=7.4.4)",
    "ipywidgets (>=8.1.7)",
    "scikit-learn (>=1.6.1)",
    "torch (>=2.1.0)",
    "torchinfo (>=1.8.0)",
    "torch-geometric (>=2.6.1)",
    "torchviz (>=0.0.3)",
    "tabulate (>=0.9.0)",
    "mlx (>=0.31.1)",
    "mlx-graphs (>=0.0.9)",
    "ipykernel (>=7.3.0,<8.0.0)"
]

[dependency-groups]
dev = [
    "py50 (>=1.1.0)",
    "optuna (>=4.4.0)",
    "shap (>=0.48.0)"
]

[tool.poetry]
packages = [{ include = "mminer_graphs" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
