[tool.poetry]
name = "molecular minter - graphs"
version = "0.0.1"
description = "Scripts to Create Molecular Graph Models"
authors = [{ name = "Tony E. Lin", email = "tonyelin@tmu.edu.tw" }]
license = { text = "MIT" }
readme = "README.md"
# repository = #todo add repository url
packages = [{ include = "mminer_graphs" }]

[tool.poetry.dependencies]
matplotlib = ">=3.10.3"
numpy = ">=2.0"
pandas = ">=2.1"
rdkit = ">=2023.09.5"
seaborn = ">=0.12.2"
datamol = ">=0.12.4"
notebook = ">=7.4.4"
scikit-learn = ">=1.6.1"
torch = ">=2.1.0"
torch_geometric = ">=2.6.1"
shap = ">=0.48.0"
optuna = ">=4.4.0"
ipywidgets = ">=8.1.7"
torchviz = ">=0.0.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
